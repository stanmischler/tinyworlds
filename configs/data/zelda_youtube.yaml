# YouTube playthroughs of the Zelda: Ocarina of Time 2D fan game, used to extend the Zelda training set.
# Same game and maps as data/zelda_frames.h5. Each entry is filled in stages:
#   scripts/data/download_videos.py   → data/zelda_youtube/raw/<id>.mp4
#   scripts/data/find_video_crop.py   → game_box, stretch (checked on a sheet against our frames)
#   junk: non-gameplay [start_s, end_s] ranges, labelled by hand on a contact sheet (one frame every 5 s)
#   scripts/data/flag_video_frames.py → cuts (frame runs removed from the .h5: black, blank and junk)
# stretch: horizontal / vertical scale of the game in the video (4/3 = 4:3 game stretched to 16:9).
