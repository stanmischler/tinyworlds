# CPU smoke profile for the pong_v1 recipe: loads the pong_v1 stage yamls (so their keys are validated) but shrinks
# every model and runs 2 steps per stage. Use with:
#   WANDB_MODE=offline MPLBACKEND=Agg python scripts/pipeline/full_train.py --config configs/dev/dev_training_pong_cpu.yaml
# Delete the resulting results/<timestamp>/ afterwards so it doesn't shadow real checkpoints.
use_wandb: true
wandb_project: tinyworlds-dev

dataset: PONG_TRAIN
frame_size: 64
preload_ratio: 0.03
device: CPU

patch_size: 4
context_length: 4
latent_dim: 6
num_bins: 4
n_actions: 16
embed_dim: 32
num_heads: 4
hidden_dim: 64
num_blocks: 1

compile: false
tf32: false
amp: false
log_interval: 1
n_updates: 2
learning_rate: 0.0001
batch_size_per_gpu: 2
gradient_accumulation_steps: 1
num_workers: 0
pin_memory: false

video_tokenizer_config: configs/experiments/pong_v1/video_tokenizer.yaml
latent_actions_config: configs/experiments/pong_v1/latent_actions.yaml
dynamics_config: configs/experiments/pong_v1/dynamics.yaml

run_video_tokenizer: true
run_latent_actions: true
run_dynamics: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true
optimizer: adamw
use_moe: false
