# Flow-matching dynamics without actions (OBJ3D): LPWM's protocol gives 6 real frames and predicts 44, one at a time,
# with a sliding 6-frame context. Clips of 7 frames = 6 context + the predicted one.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 30000
learning_rate: 0.0003
log_interval: 1000
context_length: 7

use_actions: false

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

video_tokenizer_path:     # this run's tokenizer (full_train.py)
latent_actions_path:

checkpoint:
