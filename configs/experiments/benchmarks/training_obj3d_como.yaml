# "obj3d CoMo actions", dynamics stage only: reuses the frozen tokenizer of "obj3d flow" and the CoMo z exported by
# scripts/actions/como_actions.py (configs/como/obj3d.yaml trains CoMo first). Commands: experiments/benchmarks/README.md
dataset: OBJ3D
video_tokenizer_config: configs/experiments/benchmarks/tokenizer.yaml   # not run
dynamics_config: configs/experiments/benchmarks/dynamics_como.yaml
run_video_tokenizer: false
run_dynamics: true
use_wandb: true
wandb_project: tinyworlds
preload_ratio: 1.0

patch_size: 4             # 1024 tokens per 128px frame
frame_size: 128           # the .h5 is 128 px (the Modal launcher re-reads it from the .h5)
latent_dim: 16            # KL tokenizer: 16 continuous channels per token
num_bins: 4               # FSQ only (unused)
n_actions: 16             # unused (no LAM); required by the schema

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

latent_actions_config: configs/latent_actions.yaml   # not run
run_latent_actions: false

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
