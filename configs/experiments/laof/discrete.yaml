# STA-39 LAOF, discrete arm: 16-code EMA VQ on a 128-d action (one codebook, one latent).
# Recipe = LAOF stage1_idm_flowdecoder.py (conf/defualt.yaml) at 128 px; flow from experiments/laof/laof_flow.py (gap 4, camera-compensated).
#   python experiments/laof/train_laof.py --config configs/experiments/laof/discrete.yaml            (Modal: experiments/laof/modal_laof.py::train_laof)
run_name: ""
seed: 0
device: auto
train_h5: data/zelda_train_frames.h5
train_flow: data/zelda_train_flow_gap4.h5
val_h5: data/zelda_test_frames.h5
val_flow: data/zelda_test_flow_gap4.h5
load_start_index: 1000  # ZeldaDataset skips the first 1000 rows
limit: 0                # >0: only the first rows (smoke)
gap: 4

# model (models/laof.py)
frame_size: 128
action_dim: 128
continuous: false
num_codebooks: 1
num_latents: 1
num_embs: 16
commitment: 0.05
decay: 0.99            # LAOF 0.999 (64 codes x 8 chunks); 0.99 so dead-code restarts fire within ~230 steps (smoke: 4 codes at step 300)
restart_threshold: 0.1   # VQ dead-code restart (EMA hits per batch); 0 = LAOF original
kl_weight: 0.0
flow_weight: 1.0
flow_sigma: 0.02        # flow magnitude saturating the colour, as a fraction of the 181 px diagonal (~3.6 px)
flow_mask_tol: 0.1      # zero the flow where the camera shift explains the pixel (models/laof.camera_mask); 0 = off
flow_mask_dilate: 2
flow_target: image      # image = LAOF (z-only U-Net draws the RGB flow); global = MLP predicts mean masked flow + amount (models/laof.global_flow_target)
impala_scale: 4
unet_base: 24
eval_clusters: 16

# optimisation
n_updates: 50000
batch_size: 128
lr: 3.0e-4
weight_decay: 0.01
grad_clip: 2.0
log_interval: 100
ckpt_interval: 5000
val_pairs: 1024
checkpoint: ""          # resume: a latent_actions_step_N dir

use_wandb: true
wandb_project: tinyworlds
