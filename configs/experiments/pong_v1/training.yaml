# Pong v1: best-effort single-H100 run on the clean Pong train split (64px, patch 4 = 256 tokens/frame).
# Same skeleton as sonic_v3 / zelda_v3 (inference-style masking, loader knobs, 4096-code tokenizer), sized for Pong:
# frames are almost all black with 1-pixel-wide paddles/ball (~1 px of ball motion per cached frame, ~4 px per model
# step at frame_skip 4), so the tokenizer must keep single pixels and the LAM must carry both paddles' inputs.
# Launch: TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset PONG_TRAIN --training-config configs/experiments/pong_v1/training.yaml
# Keys here override the same keys in the stage yamls below; per-stage knobs live in those files.
use_wandb: true
wandb_project: tinyworlds

dataset: PONG_TRAIN       # pong_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~97k train frames (1.2 GB in RAM)

patch_size: 4             # 256 tokens per 64px frame, as the Sonic runs
context_length: 4
frame_size: 64            # pong_frames.h5 is 64x64; the Modal launcher re-reads it from the .h5
latent_dim: 6             # tokenizer vocab = num_bins**latent_dim = 4096 (Pong has far fewer distinct patches; the slack is free)
num_bins: 4
n_actions: 16             # two paddles x {up, down, stay} = 9 joint inputs per step, which 8 codes cannot cover; 16 leaves slack

amp: true
tf32: true
compile: true

# dataloader throughput; remove both lines (or set them to null) to return to the defaults (2 workers, no pinning)
num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/pong_v1/video_tokenizer.yaml
latent_actions_config: configs/experiments/pong_v1/latent_actions.yaml
dynamics_config: configs/experiments/pong_v1/dynamics.yaml
run_video_tokenizer: true
run_latent_actions: true
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
