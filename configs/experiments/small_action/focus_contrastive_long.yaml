# The simple recipe at full length (base, curated_data, focus_contrastive): 200k steps, InfoNCE weight 0.0001 (picked by the 20k weight sweep).
# A checkpoint and its scores every 10k steps, so the run fits the 24 h limit of one Modal call; relaunching the same command resumes it.
run_name: focus_contrastive_long
contrastive_weight: 0.0001
n_updates: 200000
ckpt_interval: 10000
