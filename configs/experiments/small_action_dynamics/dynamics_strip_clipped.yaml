# The shipped "flow matching, small action" recipe (small_action_dynamics.yaml) on the actions of the oversampling-crop-shift action
# model (results/weights_and_window, step 200000), 200k steps on 8 GPUs with the same batch of 64. Launch: training_eight_gpus_*.yaml.
# Strip revealed by the camera scroll: kept in the loss, its error weight capped at 1 (the mean of the weights taken outside it).
batch_size_per_gpu: 8      # x 8 GPUs = a batch of 64, as the shipped run
gradient_accumulation_steps: 1
n_updates: 200000
learning_rate: 0.001   # sweep winner
log_interval: 5000   # checkpoint + sampled-prediction PNG (100k and the final step are scored)

use_actions: true

# YouTube windows: rows (r, r + 2, r + 4, ...), the action model's YouTube pair step (7-8.75 px moving median, as our capture's
# skip 4); our capture stays at skip 4. Departure from PR #51's 5 h recipe (YouTube skip 1).
extra_frame_skip: 2

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

# error-weighted loss (zelda_regularisation/error_weighted.yaml, without its token shift / dropout / weight decay, which the 5 h recipe has not)
token_loss: focal         # mean(sg((e / per-sample mean e)^focal_gamma) * e) over the tokens in the loss
focal_gamma: 1.0          # sweep winner
focal_exclude_scroll_strip: false
focal_strip_clip: true   # the strip revealed by the camera scroll counts, its weight capped at 1

video_tokenizer_path: results/zelda_more_data_tokenizer/video_tokenizer/checkpoints/video_tokenizer_step_59000   # frozen, 5 h
latent_actions_path: results/small_action_actions_oversampling_crop_shift_200000_yt2   # action dir: action model + mean/std
action_file: data/zelda_more_train_small_action_oversampling_crop_shift_200000_yt2.npy  # raw (s, a) per row: base .h5 from row 0, then YouTube

test_eval_h5: data/zelda_test_frames.h5
test_eval_interval: 0   # off: the curve would score the confirm half every 2k steps; report numbers come from eval_next_frame.py

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
