# "flow matching, small action": the 5 h dynamics recipe of "more data flow matching" (zelda_more_data/dynamics.yaml: 13M latent flow
# matching, its 5 h tokenizer, 100k steps, cosine lr, batch 64, EMA .999, seed 0) conditioned on our 10-number action instead of
# CoMo's 128-number z, with the error-weighted loss on. Action: s (2, measured shift) + a (8, small action model's encoder), frozen,
# precomputed per row (experiments/small_action/dynamics_actions.py), unit variance per number from the training pairs.
# learning_rate and focal_gamma: the sweep winner's, dyn_lr1e-3_err1 (6 arms dyn_*.yaml at 20k, selection rule in
# experiments/small_action/dynamics_score.py). Launch: header of training.yaml.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 100000
learning_rate: 0.001   # sweep winner
log_interval: 1000   # checkpoint + sampled-prediction PNG

use_actions: true

# YouTube windows: rows (r, r + 2, r + 4, ...), the action model's YouTube pair step (7-8.75 px moving median, as our capture's
# skip 4); our capture stays at skip 4. Departure from PR #51's 5 h recipe (YouTube skip 1).
extra_frame_skip: 2

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

# error-weighted loss (zelda_regularisation/error_weighted.yaml, without its token shift / dropout / weight decay, which the 5 h recipe has not)
token_loss: focal         # mean(sg((e / per-sample mean e)^focal_gamma) * e) over the tokens in the loss
focal_gamma: 1.0          # sweep winner
focal_exclude_scroll_strip: true   # the strip revealed by the camera scroll is left out (unpredictable)

video_tokenizer_path: results/zelda_more_data_tokenizer/video_tokenizer/checkpoints/video_tokenizer_step_59000   # frozen, 5 h
latent_actions_path: results/small_action_actions_late_weight_focus_200000_yt2        # action dir: action model + mean/std; train_dynamics --action replaces both
action_file: data/zelda_more_train_small_action_late_weight_focus_200000_yt2.npy      # raw (s, a) per row: base .h5 from row 0, then YouTube

test_eval_h5: data/zelda_test_frames.h5
test_eval_interval: 0   # off: the curve would score the confirm half every 2k steps; report numbers come from eval_next_frame.py

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
