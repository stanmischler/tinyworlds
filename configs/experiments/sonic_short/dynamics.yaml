gradient_accumulation_steps: 1
n_updates: 15000
learning_rate: 0.0005
log_interval: 500   # checkpoint + prediction PNG every 500 steps

use_actions: true

embed_dim: 128
num_heads: 8
hidden_dim: 256
num_blocks: 4

