# Short Sonic run (a few hours on one H100): the pretrained-Sonic recipe with cut-down schedules.
# Launch: TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset SONIC --training-config configs/experiments/sonic_short/training.yaml
# Keys here override the same keys in the stage yamls below; per-stage knobs live in those files.
use_wandb: true
wandb_project: tinyworlds

dataset: SONIC
preload_ratio: 1.0        # all ~41k frames (default training.yaml uses 0.005)

patch_size: 4
context_length: 4
frame_size: 64            # sonic_frames.h5 is 64x64; the Modal launcher re-reads it from the .h5
latent_dim: 6             # tokenizer vocab = num_bins**latent_dim = 4096, as in the pretrained Sonic set
num_bins: 4
n_actions: 16             # pretrained Sonic used 16

amp: true
tf32: true
compile: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/sonic_short/video_tokenizer.yaml
latent_actions_config: configs/experiments/sonic_short/latent_actions.yaml
dynamics_config: configs/experiments/sonic_short/dynamics.yaml
run_video_tokenizer: true
run_latent_actions: true
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
