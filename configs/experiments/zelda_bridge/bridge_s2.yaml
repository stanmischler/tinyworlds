# Brownian bridge sweep arm: s 2.0, stabilised loss, fine-tune 8k from the noise-start FM.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 8000
learning_rate: 0.0001
log_interval: 1000   # checkpoint + sampled-prediction PNG every 1000 steps

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 5.0             # sampling grid only (bridge training times are uniform)
fm_source: bridge         # Brownian bridge from the clean x3
fm_source_noise: 2.0       # bridge scale s
bridge_loss: stabilised
init_weights: results/zelda_cont_final_tp/dynamics/checkpoints/dynamics_step_29000   # noise-start FM (EMA), fresh optimizer
qk_norm: true
ema_decay: 0.999
seed: 0

video_tokenizer_path: results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000   # frozen KL c16 tokenizer
latent_actions_path: results/como_actions_v1_full   # CoMo IDM + train z stats, models/como.py CoMoActions
action_file: data/zelda_train_como_z.npy             # raw z per train .h5 row

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
