# Brownian bridge dynamics (ViBT, arXiv 2511.23199): the flow goes from the clean previous frame z3 to z4 along
# x_t = (1 - t) z3 + t z4 + s sqrt(t (1 - t)) eps, t ~ U(0, 0.999), velocity loss divided by alpha^2 (Eq. 14-15),
# variance-corrected Euler-Maruyama sampler (Eq. 17). Fine-tuned from the same noise-start FM as FlowC2S
# (zelda_cont_final_tp step 29000, EMA), same recipe (lr 1e-4, bs 64, EMA 0.999); frozen KL c16 tokenizer + CoMo full z.
# Sweep 8k: s in {0.25, 0.5, 1, 2} (bridge_s025/s05/s1/s2), then bridge_plain (best s, plain velocity loss), then
# bridge_final (30k, best s + better loss). fm_shift 5 only shapes the sampling grid (paper's gamma).
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN \
#     --training-config configs/experiments/zelda_bridge/training.yaml \
#     --overrides "dynamics_config=configs/experiments/zelda_bridge/<arm>.yaml" --run-name zelda_<arm>
# Eval (890 held-out windows; checkpoint 7000 for the 8k sweep, as FlowC2S; 29000 for the final):
#   modal run --detach scripts/infra/modal_train.py::eval_dynamics --run-dir zelda_<arm> --name zelda_<arm> \
#     --num-steps 1,2,4,8 --extra-args "--test-h5 data/zelda_test_frames.h5 --latent-actions-path results/como_actions_v1_full \
#     --video-tokenizer-path results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000 \
#     --dynamics-path results/zelda_<arm>/dynamics/checkpoints/dynamics_step_<7000 | 29000>"
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per token; 1024 tokens per 128px frame
context_length: 4
frame_size: 128
latent_dim: 16            # KL c16 tokenizer (taken from the checkpoint anyway)
num_bins: 4               # FSQ only
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_final_tp.yaml      # unused (run_video_tokenizer false)
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                  # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_bridge/bridge_s1.yaml                        # per arm via --overrides
run_video_tokenizer: false   # frozen KL c16 tokenizer: video_tokenizer_path in the dynamics yamls
run_latent_actions: false    # CoMo actions: path in the dynamics yamls
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
