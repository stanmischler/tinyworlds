# STA-42: Zelda dynamics conditioned on CoMo actions (como_zelda_v1 step 50000, PR #13). Dynamics only, frozen tokenizer.
# 4 arms = {k16, full} x {v3 temporal tokenizer, v5 per-frame tokenizer}, recipe = zelda_v4 copy_long, actions precomputed
# per .h5 row (scripts/actions/como_actions.py -> data/zelda_train_como_z.npy + results/como_actions_v1_{full,k16}/).
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN --training-config configs/experiments/zelda_como/training.yaml \
#     --overrides "dynamics_config=configs/experiments/zelda_como/dynamics_k16_v3.yaml" --run-name zelda_como_k16_v3
# lr sweep (v3 + k16, 8k steps): add ",learning_rate=1e-4,n_updates=8000" and --run-name zelda_como_sweep_lr1e-4
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per code, same density as the Sonic runs; 1024 tokens per 128px frame
context_length: 4
frame_size: 128           # zelda_frames.h5 is 128x128; the Modal launcher re-reads it from the .h5
latent_dim: 6             # tokenizer vocab = num_bins**latent_dim = 4096
num_bins: 4
n_actions: 16             # k-means clusters of the CoMo z (k16 arm); logging only for the full arm

amp: true
tf32: true
compile: true

# dataloader throughput; remove both lines (or set them to null) to return to the defaults (2 workers, no pinning)
num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_v3/video_tokenizer.yaml
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml
dynamics_config: configs/experiments/zelda_como/dynamics_k16_v3.yaml
run_video_tokenizer: false   # frozen checkpoints, paths set in the dynamics yamls
run_latent_actions: false
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
