# STA-62 final: FM dynamics on this run's tokenizer; identical to configs/experiments/zelda_fm/dynamics_full_long.yaml
# (the FSQ temporal reference, zelda_fm_full) except the tokenizer. 30k steps.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 30000
learning_rate: 0.0003
log_interval: 1000   # checkpoint + sampled-prediction PNG every 1000 steps

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

video_tokenizer_path: 
latent_actions_path: results/como_actions_v1_full   # CoMo IDM + train z stats, models/como.py CoMoActions
action_file: data/zelda_train_como_z.npy             # raw z per train .h5 row

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
