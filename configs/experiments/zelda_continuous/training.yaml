# Continuous video tokenizer vs FSQ (STA-62). Each app trains a tokenizer, then flow-matching dynamics on it (same app),
# conditioned on the full CoMo z (MAE features, independent of the tokenizer), so the tokenizer bottleneck is the only change.
# FSQ references: zelda_fm_full (v3 temporal FSQ + FM, 29.81 dB) and zelda_cont_fsq_pf (v5 per-frame FSQ + FM, run here).
#
# Sweep (per-frame, 15k tokenizer + 8k FM), 6 arms = bottleneck {tanh, kl} x latent_dim {4, 6, 16}:
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN \
#     --training-config configs/experiments/zelda_continuous/training.yaml \
#     --overrides "video_tokenizer_config=configs/experiments/zelda_continuous/tokenizer_sweep_tanh.yaml,latent_dim=4" \
#     --run-name zelda_cont_sweep_tanh_c4
# Finals (30k tokenizer + 30k FM), winner bottleneck / latent_dim, per-frame and temporal:
#   --overrides "video_tokenizer_config=configs/experiments/zelda_continuous/tokenizer_final_<pf|tp>.yaml,dynamics_config=configs/experiments/zelda_continuous/dynamics_final.yaml,latent_dim=<c>"
#   --run-name zelda_cont_final_<pf|tp>
# FSQ per-frame twin (frozen v5 tokenizer, FM only):
#   --overrides "run_video_tokenizer=false,dynamics_config=configs/experiments/zelda_continuous/dynamics_fsq_pf.yaml" --run-name zelda_cont_fsq_pf
# Eval (890 held-out windows; add --video-tokenizer-path for the FSQ twin, whose run dir holds no tokenizer):
#   modal run --detach scripts/infra/modal_train.py::eval_dynamics --run-dir <run> --name <run>_29000 --num-steps 1,4 \
#     --extra-args "--test-h5 data/zelda_test_frames.h5 --latent-actions-path results/como_actions_v1_full"
#   scripts/eval/tokenizer_frame_eval.py --run "<label>=<tokenizer ckpt>" ... --test-h5 data/zelda_test_frames.h5
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per token; 1024 tokens per 128px frame
context_length: 4
frame_size: 128
latent_dim: 6             # continuous: channels per token (sweep 4/6/16 via --overrides); FSQ: 4**6 = 4096 codes
num_bins: 4               # FSQ only
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_sweep_tanh.yaml   # per arm via --overrides
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                  # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_continuous/dynamics_sweep.yaml
run_video_tokenizer: true    # tokenizer, then FM dynamics on this run's tokenizer
run_latent_actions: false    # CoMo actions: path in the dynamics yamls
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
