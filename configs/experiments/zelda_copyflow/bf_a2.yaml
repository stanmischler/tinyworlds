# STA-61 Video Bi-flow sweep arm: alpha_max 2.0, 8k from scratch.
batch_size_per_gpu: 32          # two nets OOM at 64 on an 80 GB H100; 32 x 2 accumulation = same effective 64
gradient_accumulation_steps: 2
n_updates: 8000
learning_rate: 0.0003
log_interval: 1000   # checkpoint + sampled-prediction PNG every 1000 steps

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: biflow     # two nets (velocity + denoiser), uniform t, from scratch
bf_alpha_max: 2.0         # training noise alpha ~ U(0, bf_alpha_max)
bf_eps: 0.1               # default sampling start noise; swept at eval with --bf-eps
qk_norm: true
ema_decay: 0.999
seed: 0

video_tokenizer_path: results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000   # frozen STA-62
latent_actions_path: results/como_actions_v1_full   # CoMo IDM + train z stats, models/como.py CoMoActions
action_file: data/zelda_train_como_z.npy             # raw z per train .h5 row

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
