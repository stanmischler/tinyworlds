# Copy-last flow matching (STA-61): the dynamics flow starts from the previous frame's latents instead of noise.
# Frozen: STA-62 KL c16 temporal tokenizer (zelda_cont_final_tp step 29000) and CoMo full-z actions; only dynamics trains.
# FlowC2S (arXiv 2604.17625): fine-tune the STA-62 noise FM (EMA weights) on x3 + sigma*n -> x4, sigma in {0, .1, .3, .5}.
# Video Bi-flow (arXiv 2503.06364): two nets (velocity + denoiser) from scratch, alpha_max in {0.5, 1, 2}; eps at eval.
# Sweep 8k steps, finals 30k (best next-frame PSNR at its best step count).
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN \
#     --training-config configs/experiments/zelda_copyflow/training.yaml \
#     --overrides "dynamics_config=configs/experiments/zelda_copyflow/<arm>.yaml" --run-name zelda_copyflow_<arm>
# Eval (890 held-out windows; the run dir holds no tokenizer; Bi-flow adds --bf-eps <eps> and a name suffix):
#   modal run --detach scripts/infra/modal_train.py::eval_dynamics --run-dir zelda_copyflow_<arm> --name zelda_copyflow_<arm> \
#     --num-steps 1,2,4,8 --extra-args "--test-h5 data/zelda_test_frames.h5 --latent-actions-path results/como_actions_v1_full \
#     --video-tokenizer-path results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000"
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per token; 1024 tokens per 128px frame
context_length: 4
frame_size: 128
latent_dim: 16            # KL c16 tokenizer (taken from the checkpoint anyway)
num_bins: 4               # FSQ only
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_final_tp.yaml      # unused (run_video_tokenizer false)
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                  # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_copyflow/c2s_s01.yaml                      # per arm via --overrides
run_video_tokenizer: false   # frozen STA-62 tokenizer: video_tokenizer_path in the dynamics yamls
run_latent_actions: false    # CoMo actions: path in the dynamics yamls
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
