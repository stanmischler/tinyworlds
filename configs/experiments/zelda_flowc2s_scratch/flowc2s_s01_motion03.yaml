# FlowC2S from scratch, sigma 0.1, + 0.3 * per-sample mean error over moving tokens
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 100000
learning_rate: 0.0003
log_interval: 10000   # checkpoint + sampled-prediction PNG (and the last step)

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0
# previous-frame source (models/flow_dynamics.py FlowDynamicsModel.source): x0 = z(t) + sigma * N(0, I)
fm_source: copy
fm_source_noise: 0.1
token_loss: motion        # mean e + lambda * mean over samples with motion of (mean e over the sample's moving tokens)
token_loss_weight: 0.3
motion_loss_per_sample: true

video_tokenizer_path: results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000   # frozen KL c16 temporal
latent_actions_path: results/como_actions_v1_full   # CoMo IDM + train z stats, models/como.py CoMoActions
action_file: data/zelda_train_como_z.npy             # raw z per train .h5 row

test_eval_h5: data/zelda_test_frames.h5   # test/* curve for watching; the reported number is eval_next_frame.py
test_eval_interval: 2000

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
