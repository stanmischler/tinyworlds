# FlowC2S from scratch: the dynamics model flows from the previous frame's latents (+ sigma * noise) to the next frame's,
# trained from scratch on the 13M "longer flow matching" recipe (configs/experiments/zelda_dynamics_scale/longer.yaml:
# 256/512/12, lr 3e-4 cosine over 100k, bs 64, shift 3, EMA 0.999, seed 0). Same frozen tokenizer (KL c16 temporal,
# zelda_cont_final_tp step 29000) and frozen CoMo actions. Earlier FlowC2S runs were fine-tuned from the noise flow model.
# Sweep (one dynamics yaml each), stopped at 10k on the 100k schedule (CLI stop_step=10000):
#   flowc2s_s{01,03,05}.yaml                sigma 0.1 / 0.3 / 0.5, plain velocity loss
#   flowc2s_s{01,03,05}_motion{01,03}.yaml  + lambda 0.1 / 0.3 * per-sample mean error over moving tokens
# Winners (scripts: experiments/flowc2s_scratch/pick_winners.py): best held-out PSNR among the plain runs; best judge-box
# LPIPS among the motion runs whose PSNR is within 0.5 dB of the best plain run (32 Euler steps). Each winner then
# resumes from its step-9999 checkpoint to 100k (CLI checkpoint=results/<run>/dynamics/checkpoints/dynamics_step_9999).
# Launch on Jean Zay: see cluster/README.md (one H100 job per run, train_dynamics.py with this training yaml).
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per token; 1024 tokens per 128px frame
context_length: 4
frame_size: 128
latent_dim: 16            # KL c16 tokenizer (taken from the checkpoint anyway)
num_bins: 4               # FSQ only
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_final_tp.yaml      # unused (run_video_tokenizer false)
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                  # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_flowc2s_scratch/flowc2s_s03.yaml   # per run
run_video_tokenizer: false   # frozen KL c16 temporal tokenizer: video_tokenizer_path in the dynamics yamls
run_latent_actions: false    # CoMo actions: path in the dynamics yamls
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
