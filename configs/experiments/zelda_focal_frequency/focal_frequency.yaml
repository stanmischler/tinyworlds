# focal frequency loss: longer.yaml with lambda * f_loss_scale * f-loss + (1 - lambda) * v-loss,
# lambda = sigmoid(-(step - f_switch_step) / f_switch_width)
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 100000
learning_rate: 0.0003
log_interval: 1000   # checkpoint + sampled-prediction PNG

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

fm_loss: fv
f_switch_step: 50000    # placeholder: run_local.sh passes the crossing step from pick_switch.py
f_switch_width: 5000    # 5% of the run (the paper gives no width)
f_loss_scale: 1.0       # placeholder: run_local.sh passes mean v-loss / mean f-loss of the f-only run around the crossing

video_tokenizer_path: results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000   # frozen KL c16 temporal
latent_actions_path: results/como_actions_v1_full   # CoMo IDM + train z stats, models/como.py CoMoActions
action_file: data/zelda_train_como_z.npy             # raw z per train .h5 row

test_eval_h5: data/zelda_test_frames.h5   # test/* curve for watching; the reported number is eval_next_frame.py
test_eval_interval: 2000

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
