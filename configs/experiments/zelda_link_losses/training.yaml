# Losses and action guidance against the fading moving sprite (Link) on Zelda. Same tokenizer (frozen KL c16 temporal,
# zelda_cont_final_tp step 29000), actions (frozen CoMo full z) and dynamics recipe (13M params, 256/512/12, lr 3e-4,
# bs 64, from scratch) as the "flow matching" row (30k steps, 33.78 dB); only the dynamics loss / action dropout changes.
# Runs (one yaml each):
#   motion-weighted loss   motion_weighted_l{01,03,1}.yaml  + lambda * mean error over moving tokens, 8k-step lambda sweep;
#                          the best lambda (test PSNR) is then trained 30k (motion_weighted.yaml: lambda 0.1)
#   action guidance        action_guidance.yaml   each action dropped to a learned null action w.p. 0.2; eval w 1/1.5/2/3
#   worst-error loss       worst_error.yaml       + mean error of each sample's worst 5% tokens
#   token focal loss       token_focal.yaml       errors weighted by sg(e / per-sample mean e), gamma 1
# Launch (one per run):
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN \
#     --training-config configs/experiments/zelda_link_losses/training.yaml \
#     --overrides "dynamics_config=configs/experiments/zelda_link_losses/<run>.yaml" --run-name zelda_<run>
# Eval (1 Euler step for PSNR/SSIM, 4 for LPIPS; action guidance adds --guidance-scale 1.5 / 2 / 3 with its own --name):
#   modal run --detach scripts/infra/modal_train.py::eval_dynamics --run-dir zelda_<run> --name zelda_<run> \
#     --num-steps 1,4 --extra-args "--test-h5 data/zelda_test_frames.h5 --latent-actions-path results/como_actions_v1_full \
#     --video-tokenizer-path results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000 \
#     --dynamics-path results/zelda_<run>/dynamics/checkpoints/dynamics_step_<last>"
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per token; 1024 tokens per 128px frame
context_length: 4
frame_size: 128
latent_dim: 16            # KL c16 tokenizer (taken from the checkpoint anyway)
num_bins: 4               # FSQ only
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_final_tp.yaml      # unused (run_video_tokenizer false)
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                  # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_link_losses/motion_weighted_l1.yaml   # per run via --overrides
run_video_tokenizer: false   # frozen KL c16 temporal tokenizer: video_tokenizer_path in the dynamics yamls
run_latent_actions: false    # CoMo actions: path in the dynamics yamls
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
