# Dynamics of "more data flow matching": the "longer flow matching" recipe (zelda_dynamics_scale/longer.yaml: 13M params,
# 100k steps) on ZELDA_MORE_TRAIN, on this study's tokenizer and CoMo actions instead of the 20-min ones.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 100000
learning_rate: 0.0003
log_interval: 1000   # checkpoint + sampled-prediction PNG

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

video_tokenizer_path: results/zelda_more_data_tokenizer/video_tokenizer/checkpoints/video_tokenizer_step_59000   # frozen, this study's
latent_actions_path: results/zelda_more_data_actions_full   # CoMo IDM + train z stats of this study (como_actions.py --dataset)
action_file: data/zelda_more_train_como_z.npy               # raw z per row: base .h5 from row 0, then the YouTube files

test_eval_h5: data/zelda_test_frames.h5   # test/* curve for watching; the reported number is eval_next_frame.py
test_eval_interval: 2000

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
