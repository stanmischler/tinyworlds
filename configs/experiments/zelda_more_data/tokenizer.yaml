# Tokenizer of "more data flow matching": the KL c16 temporal tokenizer of zelda_continuous/tokenizer_final_tp.yaml
# (latent_dim 16 in training.yaml), trained from scratch on ZELDA_MORE_TRAIN for 60k steps instead of 30k.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 60000          # 2x the 20-min recipe: the new data covers ~17x more scenes
learning_rate: 0.0002
log_interval: 1000

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 8

per_frame: false
bottleneck: kl          # sweep winner: kl c16 31.69 dB next-frame at 8k (tanh c16 29.33, kl c6 29.69)
latent_noise: 0.8
kl_weight: 1.0e-6

checkpoint:
