# Next-frame prediction directly in pixel space: no tokenizer, the 13M flow-matching / EDM dynamics model predicts
# patch_size x patch_size pixel patches of the next frame (models/pixel_patches.py), conditioned on the frozen full CoMo z,
# same backbone, optimiser and lr schedule as the latent baseline (configs/experiments/zelda_continuous/dynamics_final.yaml,
# run zelda_cont_final_tp: 33.78 dB at 1 step). Only the predicted space and the noising objective change.
#
# Sweep, 10k steps on the 30k schedule (stop_step), one app per arm; patch size via --overrides:
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN \
#     --training-config configs/experiments/zelda_pixel/training.yaml \
#     --overrides "patch_size=4,dynamics_config=configs/experiments/zelda_pixel/fm_x_s3.yaml" --run-name zelda_pixel_fm_x_s3_p4
#   arms: fm_{x_s1,x_s3,x_s5,v_s3} at p4, fm_{x_s3,v_s3} at p8, then edm_{pm04,p0,pp04} at the better patch size
# Final: resume the best FM and the best EDM arm to 30k (a yaml with `checkpoint:` = its step-9999 dir and no stop_step).
# Eval (890 held-out windows, 1 and 32 steps; a pixel run has no tokenizer):
#   modal run --detach scripts/infra/modal_train.py::eval_dynamics --run-dir <run> --name <run>_<step> --num-steps 1,32 \
#     --extra-args "--test-h5 data/zelda_test_frames.h5 --latent-actions-path results/como_actions_v1_full --dynamics-path results/<run>/dynamics/checkpoints/dynamics_step_<step>"
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # pixel patch: 4 -> 1024 tokens x 48 values per frame, 8 -> 256 tokens x 192 values
context_length: 4
frame_size: 128
latent_dim: 48            # set to 3 * patch_size^2 by train_dynamics.py in pixel space
num_bins: 4               # unused
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_final_tp.yaml   # unused (run_video_tokenizer false)
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_pixel/fm_x_s3.yaml                          # per arm via --overrides
run_video_tokenizer: false
run_latent_actions: false
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
