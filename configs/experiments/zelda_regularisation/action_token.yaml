# action token: regularised + shifted, plus one action token per frame in spatial attention (FiLM kept)
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 100000
learning_rate: 0.0003
log_interval: 10000   # checkpoint + sampled-prediction PNG

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

dynamics_type: flow
fm_pred: v
fm_shift: 3.0
qk_norm: true
ema_decay: 0.999
seed: 0

# regularisation (datasets/token_shift.py, models/st_transformer.py, utils/optimizer_utils.py)
token_shift: 4            # whole clip shifted by up to +-4 tokens (16 px) on the latent grid, border out of the loss
dropout: 0.1              # attention and feed-forward outputs
weight_decay: 0.05

action_token: true        # zero-init Linear(128 -> 256) of a_{t-1}, appended to each frame's tokens, dropped at the output

video_tokenizer_path: results/zelda_cont_final_tp/video_tokenizer/checkpoints/video_tokenizer_step_29000   # frozen KL c16 temporal
latent_actions_path: results/como_actions_v1_full   # CoMo IDM + train z stats, models/como.py CoMoActions
action_file: data/zelda_train_como_z.npy             # raw z per train .h5 row

test_eval_h5: data/zelda_test_frames.h5   # test/* curve for watching; the reported number is eval_next_frame.py
test_eval_interval: 2000

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N)
checkpoint:
