# Fine-tune "longer flow matching" (configs/experiments/zelda_dynamics_scale/longer.yaml, step 99999 EMA) for 2k steps on
# the YouTube Zelda frames it has never seen, with a loss on its actual 32-step samples: LPIPS + L1 on Link's 32x32 motion
# box of the decoded sample vs the real frame (models/sampled_frame_loss.py), gradient through the last Euler step only.
# Same frozen tokenizer (KL c16 temporal, step 29000) and frozen CoMo actions (computed online: no action file covers
# the YouTube rows), lr 2e-5 cosine with 5% warmup, bs 64, EMA 0.999, seed 0, checkpoint every 250 steps.
# Runs (one dynamics yaml each):
#   flow-only fine-tune     flow_only.yaml       flow loss only: what the new frames alone do
#   sampled LPIPS λ 20      sampled_lpips_20.yaml   (sampled-loss gradient ~0.1x the flow loss's)
#   sampled LPIPS λ 60      sampled_lpips_60.yaml   (~0.3x)
#   sampled LPIPS λ 200     sampled_lpips_200.yaml  (~1x)
# Launch on Jean Zay: see cluster/README.md (one H100 job per run, train_dynamics.py with this training yaml).
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_MORE_TRAIN   # zelda_train_frames.h5 (skip 4, from row 1000) + the 10 YouTube runs of data/zelda_youtube (~93% YouTube by time)
preload_ratio: 1.0        # unused by the multi-video loader (always loads every frame, ~16 GB RAM)

patch_size: 4             # 48 pixel values per token; 1024 tokens per 128px frame
context_length: 4
frame_size: 128
latent_dim: 16            # KL c16 tokenizer (taken from the checkpoint anyway)
num_bins: 4               # FSQ only
n_actions: 16             # logging only (full CoMo z)

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_continuous/tokenizer_final_tp.yaml      # unused (run_video_tokenizer false)
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml                  # unused (run_latent_actions false)
dynamics_config: configs/experiments/zelda_sampled_lpips/flow_only.yaml   # per run
run_video_tokenizer: false   # frozen KL c16 temporal tokenizer: video_tokenizer_path in the dynamics yamls
run_latent_actions: false    # CoMo actions: path in the dynamics yamls
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
