# Zelda v4 trials (dynamics only): v3 tokenizer (frozen, from the volume) + the STA-36 LAM (16 codes, i4_bal16_seed2).
# Two concurrent 8k-step trials, then one long run with whatever wins:
#   TINYWORLDS_GPU=H100 modal run --detach scripts/infra/modal_train.py --dataset ZELDA_TRAIN --training-config configs/experiments/zelda_v4/training.yaml \
#     --overrides "dynamics_config=configs/experiments/zelda_v4/dynamics_base.yaml" --run-name zelda_v4_base
#   (same with dynamics_copy.yaml / zelda_v4_copy)
# Eval: modal run scripts/infra/modal_train.py::eval_dynamics --run-dir zelda_v4_base --name zelda_v4_base --extra-args "--test-h5 data/zelda_test_frames.h5"
use_wandb: true
wandb_project: tinyworlds

dataset: ZELDA_TRAIN      # zelda_train_frames.h5: all frames minus the 10 held-out test blocks (scripts/data/split_dataset.py)
preload_ratio: 1.0        # all ~65k train frames (ZeldaDataset defaults to 0.2)

patch_size: 4             # 48 pixel values per code, same density as the Sonic runs; 1024 tokens per 128px frame
context_length: 4
frame_size: 128           # zelda_frames.h5 is 128x128; the Modal launcher re-reads it from the .h5
latent_dim: 6             # tokenizer vocab = num_bins**latent_dim = 4096
num_bins: 4
n_actions: 16             # the STA-36 LAM has 16 codes

amp: true
tf32: true
compile: true

# dataloader throughput; remove both lines (or set them to null) to return to the defaults (2 workers, no pinning)
num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/experiments/zelda_v3/video_tokenizer.yaml
latent_actions_config: configs/experiments/lam_loop/i4_bal16_seed2.yaml
dynamics_config: configs/experiments/zelda_v4/dynamics_base.yaml
run_video_tokenizer: false   # frozen checkpoints, paths set in the dynamics yamls
run_latent_actions: false
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
