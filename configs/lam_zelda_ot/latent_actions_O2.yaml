# lam_zelda_ot O2: encoder sees frames t, t+1 + the OT plan; decoder sees frame t + only where the plan changes tokens + the action
# Z4 recipe (budget = zelda_v3 LAM: 6k steps, batch 64, lr 3e-4, 128/256/4, n_actions 8) + the calibrated token transport plan
# (unbalanced OT on zelda_v3 tokenizer hidden tokens, lam 0.3, tau 0.5; scripts/eval/patch_similarity.py ot-plans).
# Launch: TINYWORLDS_GPU=H100 modal run --detach scripts/modal_train.py --dataset ZELDA_TRAIN \
#   --training-config configs/lam_zelda/training.yaml --overrides "latent_actions_config=configs/lam_zelda_ot/latent_actions_O2.yaml"
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 6001       # +1 so the last checkpoint is step 6000
learning_rate: 0.0003
log_interval: 500     # checkpoint + reconstruction PNG every 500 steps

embed_dim: 128
num_heads: 8
hidden_dim: 256
num_blocks: 4

decoder_keep_rate: 0.5
decoder_residual: true
entropy_loss_weight: 0.1
entropy_sample_weight: 0.0
encoder_pooling: attention
recon_change_weight: 0.0
continuous_actions: false
action_kl_capacity: 2.0794   # ln 8 nats: the information of 8 discrete codes (continuous_actions only)
action_kl_weight: 1.0

ot_plans: data/zelda_train_uot_gap4.npz
ot_encoder: true
ot_decoder: where

checkpoint: null
