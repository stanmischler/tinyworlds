# pusht_v1 dynamics: the zelda_v3 dynamics model (256/512/12 blocks, batch 64, lr 3e-4) for 30k steps x batch 64,
# NanoWM's 30k-step ablation budget (their target row: PSNR 26.20 / SSIM 0.962 / LPIPS 0.053 / FID 23.89).
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 30000
learning_rate: 0.0003
log_interval: 1000   # checkpoint + prediction PNG every 1000 steps
seed: 0

use_actions: true
action_source: gt            # the real Push-T actions (10-D: 5 env steps x (dx, dy), z-scored), no LAM
# per sample a target frame k in {1, 2, 3}: frames < k clean, frame k 50-100% masked, loss on k. Trains each step of
# the 1 -> 3 autoregressive rollout the eval runs (the last-frame mask would only train "3 real frames -> 4th").
mask_mode: random_target

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

# filled in by full_train.py from the tokenizer stage
video_tokenizer_path:
latent_actions_path:

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N) to restore weights, optimizer, scheduler and step
checkpoint:
