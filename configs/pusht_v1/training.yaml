# Push-T v1 (STA-29): ground-truth-action world model on DINO-WM's pusht_noise, evaluated with NanoWM's protocol
# (1 context frame -> 3 predicted frames at frame_interval 5, 256 fixed val clips; scripts/eval/eval_pusht.py).
# Two stages only: video tokenizer, then dynamics conditioned on the real 10-D actions (no latent action model).
# Data: modal run scripts/modal_train.py::convert_pusht   (-> pusht_frames.h5, pusht_val_frames.h5 in the data volume)
# Launch: TINYWORLDS_GPU=H100 TINYWORLDS_MEMORY_MB=65536 modal run --detach scripts/modal_train.py --dataset PUSHT --training-config configs/pusht_v1/training.yaml
# Keys here override the same keys in the stage yamls below; per-stage knobs live in those files.
use_wandb: true
wandb_project: tinyworlds

dataset: PUSHT            # pusht_frames.h5: 18,685 train episodes, every 5th frame (~467k frames, ~23 GB in RAM)
preload_ratio: 1.0

patch_size: 4             # 1024 tokens per 128px frame, the zelda_v3 density (the reconstruction ceiling bounds every metric)
context_length: 4         # NanoWM's num_frames: 1 context + 3 predicted
frame_size: 128           # the Modal launcher re-reads it from the .h5
latent_dim: 6             # tokenizer vocab = num_bins**latent_dim = 4096
num_bins: 4
n_actions: 8              # unused (no LAM); required by the schema

amp: true
tf32: true
compile: true

num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/pusht_v1/video_tokenizer.yaml
latent_actions_config: configs/latent_actions.yaml   # not run
dynamics_config: configs/pusht_v1/dynamics.yaml
run_video_tokenizer: true
run_latent_actions: false
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
