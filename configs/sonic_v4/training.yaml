# Sonic v4: sonic_v3 trained longer. Tokenizer warm-started from the v3 step-7500 weights (+30k steps at lr 2e-4),
# LAM from scratch for 10k steps at lr 3e-4, dynamics from scratch on the new tokens for 150k steps with
# full_last_frame_mask_prob 0.8 (the Zelda/Pong value). Model sizes unchanged, so v4 vs v3 isolates training length.
# Launch: TINYWORLDS_GPU=H100 modal run --detach scripts/modal_train.py --dataset SONIC_TRAIN --training-config configs/sonic_v4/training.yaml
# Keys here override the same keys in the stage yamls below; per-stage knobs live in those files.
use_wandb: true
wandb_project: tinyworlds

dataset: SONIC_TRAIN     # sonic_train_frames.h5: all frames minus the held-out test blocks (scripts/eval/split_dataset.py)
preload_ratio: 1.0        # all ~37k train frames

patch_size: 4
context_length: 4
frame_size: 64            # sonic_frames.h5 is 64x64; the Modal launcher re-reads it from the .h5
latent_dim: 6             # tokenizer vocab = num_bins**latent_dim = 4096, as in the pretrained Sonic set
num_bins: 4
n_actions: 8              # as in v3 (16 -> 8 did not fix LAM collapse; kept for comparability)

amp: true
tf32: true
compile: true

# dataloader throughput (sonic_v2 used the defaults: 2 workers, no pinning, and left the H100 at 2 GB / 3.4 it/s).
# Remove both lines (or set them to null) to return to the defaults.
num_workers: 8
pin_memory: true

distributed:
  use_ddp: false
  use_fsdp: false
  reshard_after_forward: false
nproc_per_node: 1
standalone: true

video_tokenizer_config: configs/sonic_v4/video_tokenizer.yaml
latent_actions_config: configs/sonic_v4/latent_actions.yaml
dynamics_config: configs/sonic_v4/dynamics.yaml
run_video_tokenizer: true
run_latent_actions: true
run_dynamics: true

optimizer: adamw
muon_momentum: 0.95
muon_backend_steps: 5
use_moe: false
num_experts: 4
top_k_experts: 2
moe_aux_loss_coeff: 0.01
