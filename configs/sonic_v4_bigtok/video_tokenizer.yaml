# Zelda-v3-sized tokenizer (256/512/8 blocks) on Sonic, from scratch, 50k steps at lr 2e-4 (4e-4 collapsed the FSQ
# codebook on Zelda with this model size). Sonic frames are 64px / 256 tokens, so batch 256 has the same tokens
# per step as Zelda's batch 64 at 1024 tokens.
batch_size_per_gpu: 256
gradient_accumulation_steps: 1
n_updates: 50000
learning_rate: 0.0002
log_interval: 1000   # checkpoint + reconstruction PNG every 1000 steps

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 8

checkpoint:
