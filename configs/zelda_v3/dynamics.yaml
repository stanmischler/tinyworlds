# zelda_v3 dynamics: 12 blocks (sonic_v3 had 8), 80k steps (v2's loss was still falling at 60k), batch 64 because
# 1024 tokens/frame x 4 frames x batch 64 is the same token count as Sonic's batch 256, which already reserved
# ~49 GB of the 80 GB H100 at 8 blocks. Wider (embed 384) does not fit at this batch.
batch_size_per_gpu: 64
gradient_accumulation_steps: 1
n_updates: 80000
learning_rate: 0.0003
log_interval: 1000   # checkpoint + prediction PNG every 1000 steps

use_actions: true

embed_dim: 256
num_heads: 8
hidden_dim: 512
num_blocks: 12

# Masking fix: with this probability a batch is trained exactly like inference (clean context frames, last frame
# 100% masked) instead of MaskGIT's random 50-100% masking over all frames. 0.0 = original behaviour.
# 0.5 was confirmed on Sonic (+3.9 dB); 0.8 spends most batches on the objective the eval measures and keeps a
# fifth on infilling for MaskGIT steps 2-10.
full_last_frame_mask_prob: 0.8

# filled in by full_train.py from the earlier stages
video_tokenizer_path:
latent_actions_path:

# resume: set to a checkpoint dir (…/dynamics/checkpoints/dynamics_step_N) to restore weights, optimizer, scheduler and step
checkpoint:
